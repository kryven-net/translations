# Chat-Karten, Scoreboard, Tab-Liste-Formatierung.
#
# Jeder Eintrag: Kommentar = aktueller deutscher Text im Code (nur zur Orientierung,
# NICHT als Vorgabe zum Abtippen gedacht) — de/en/fr darunter bitte von einem Menschen
# ausfüllen. §-Zeichen (z.B. §a, §c, §7) sind Minecraft-Farbcodes, bitte erhalten.
# %PLATZHALTER% (z.B. %PLAYER%, %NAME%) werden zur Laufzeit ersetzt, bitte erhalten.
# ============================================================

