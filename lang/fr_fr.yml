# DE: "&6&lBestrafungen &7(Feature in Entwicklung)\n&7Hier wird später die vollständige Historie aller Verwarnungen, Mutes, Kicks und Bans dieses Spielers angezeigt - inklusive Grund, Moderator, Zeitpunkt und Dauer, damit Staff auf einen Blick sieht, wie oft und wie schwer jemand bereits aufgefallen ist."
proxy-plugin.featureTextPunishments: "&6&lSanctions &7(fonctionnalité en développement)\n&7Affichera plus tard l'historique complet des avertissements, mutes, kicks et bans de ce joueur - avec motif, modérateur, date et durée, pour voir en un coup d'œil sa fiabilité."

# DE: "&6&lLetzte Chats &7(Feature in Entwicklung)\n&7Hier werden später die letzten Chat-Nachrichten dieses Spielers über alle Server hinweg angezeigt, um bei Meldungen schnell den Kontext prüfen zu können."
proxy-plugin.featureTextRecentChats: "&6&lDerniers messages &7(fonctionnalité en développement)\n&7Affichera plus tard les derniers messages de chat de ce joueur sur tous les serveurs, pour vérifier rapidement le contexte d'un signalement."

# DE: "&b&lStats &7(Feature in Entwicklung)\n&7Hier werden später Spielzeit, Siege, Level und weitere Statistiken dieses Spielers angezeigt."
proxy-plugin.featureTextStats: "&b&lStats &7(fonctionnalité en développement)\n&7Affichera plus tard le temps de jeu, les victoires, le niveau et d'autres statistiques de ce joueur."

# DE: "&d&lFreunde &7(Feature in Entwicklung)\n&7Hier wird später die Freundesliste dieses Spielers angezeigt."
