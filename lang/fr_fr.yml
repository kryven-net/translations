# DE: "&7&lGenerelle Infos &7(Feature in Entwicklung)\n&7Hier werden später zusätzliche allgemeine Informationen zu diesem Spieler angezeigt, z. B. Rang, Beitrittsdatum und verknüpfte Accounts."
